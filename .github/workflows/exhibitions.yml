# Every morning, collect exhibitions from the museums' official pages into data/exhibitions.json.
# Needs the repository secret GEMINI_API_KEY (Settings → Secrets and variables → Actions).
name: 展示情報の更新

on:
  schedule:
    - cron: "30 19 * * *" # 04:30 in Japan
    - cron: "30 7 * * *"  # 16:30 in Japan (second round, so all museums are covered sooner)
  workflow_dispatch:
    inputs:
      museums:
        description: "美術館ID（空欄ならすべて。例: nmwa tnm）"
        required: false
        default: ""
      debug:
        description: "ページの中身を保存して確認する（開発用）"
        required: false
        default: "0"

permissions:
  contents: write

concurrency:
  group: exhibitions
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: 展示情報を集める
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          DEBUG_DUMP: ${{ github.event.inputs.debug }}
        run: node scripts/fetch-exhibitions.mjs ${{ github.event.inputs.museums }}
      - name: 確認用にページの中身を残す
        if: ${{ github.event.inputs.debug == '1' }}
        uses: actions/upload-artifact@v4
        with:
          name: pages
          path: debug/
          retention-days: 3
      - name: 変わっていれば保存する
        run: |
          git add data/exhibitions.json data/exhibitions-state.json 2>/dev/null || true
          if git diff --cached --quiet; then echo "変更なし"; exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/exhibitions.json data/exhibitions-state.json
          git commit -m "展示情報を更新"
          git pull --rebase origin main
          git push
